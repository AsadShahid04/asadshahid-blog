<svg xmlns="http://www.w3.org/2000/svg" width="750" height="400" viewBox="0 0 750 400">
  <!-- Title -->
  <text x="375" y="30" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Tool Call Streaming Pipeline</text>
  
  <!-- Pipeline boxes -->
  <rect x="50" y="120" width="140" height="60" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="120" y="146" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Preprocessor</text>
  <text x="120" y="164" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Extract chunks</text>
  
  <rect x="230" y="120" width="140" height="60" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="300" y="146" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Jail</text>
  <text x="300" y="164" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Validate format</text>
  
  <rect x="410" y="120" width="140" height="60" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="480" y="146" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Parser</text>
  <text x="480" y="164" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Parse calls</text>
  
  <rect x="590" y="120" width="140" height="60" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="660" y="146" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Aggregator</text>
  <text x="660" y="164" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Emit results</text>
  
  <!-- Flow arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#76B900"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#cc0000"/>
    </marker>
  </defs>
  
  <line x1="190" y1="150" x2="230" y2="150" stroke="#76B900" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="150" x2="410" y2="150" stroke="#76B900" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="150" x2="590" y2="150" stroke="#76B900" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Problem scenario: tool_choice=required -->
  <rect x="130" y="240" width="500" height="120" fill="#fff5f5" stroke="#cc0000" stroke-width="2" rx="4" stroke-dasharray="4,4"/>
  <text x="380" y="265" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#cc0000" font-weight="bold">Bug: tool_choice="required" with format-aware parser</text>
  
  <rect x="160" y="280" width="200" height="60" fill="#ffe8e8" stroke="#cc0000" stroke-width="1.5" rx="3"/>
  <text x="260" y="300" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Incorrect Path</text>
  <text x="260" y="318" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Routed to JSON mode</text>
  <text x="260" y="332" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Raw XML leaks</text>
  
  <line x1="360" y1="310" x2="415" y2="310" stroke="#cc0000" stroke-width="2" marker-end="url(#arrow-red)"/>
  
  <rect x="415" y="280" width="195" height="60" fill="#e8f5d8" stroke="#76B900" stroke-width="1.5" rx="3"/>
  <text x="512" y="300" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Correct Path (Fix)</text>
  <text x="512" y="318" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Prioritize parser when</text>
  <text x="512" y="332" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">format-aware parser set</text>
  
  <!-- Input/Output labels -->
  <text x="120" y="100" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666" font-style="italic">Model output stream</text>
  <text x="660" y="200" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666" font-style="italic">Structured calls</text>
</svg>