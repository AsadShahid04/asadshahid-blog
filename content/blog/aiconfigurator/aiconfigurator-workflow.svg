<svg xmlns="http://www.w3.org/2000/svg" width="750" height="350" viewBox="0 0 750 350">
  <!-- Title -->
  <text x="375" y="30" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1e1e1e" font-weight="bold">AIConfigurator Five-Step Workflow</text>
  
  <!-- Step 1: PerfDatabase -->
  <rect x="50" y="70" width="110" height="70" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="105" y="92" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">1. PerfDatabase</text>
  <text x="105" y="110" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Kernel-level</text>
  <text x="105" y="124" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">GEMM, attention,</text>
  <text x="105" y="136" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">comm, memory</text>
  
  <!-- Step 2: TaskRunner -->
  <rect x="190" y="70" width="110" height="70" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="245" y="92" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">2. TaskRunner</text>
  <text x="245" y="110" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Enumerate</text>
  <text x="245" y="124" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">configuration</text>
  <text x="245" y="136" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">space + prune</text>
  
  <!-- Step 3: InferenceSession -->
  <rect x="330" y="70" width="110" height="70" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="385" y="86" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">3. Inference</text>
  <text x="385" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Session</text>
  <text x="385" y="118" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Estimate TTFT</text>
  <text x="385" y="132" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">& TPOT per</text>
  <text x="385" y="145" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">configuration</text>
  
  <!-- Step 4: Pareto Analyzer -->
  <rect x="470" y="70" width="110" height="70" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="525" y="86" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">4. Pareto</text>
  <text x="525" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Analyzer</text>
  <text x="525" y="118" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Filter to</text>
  <text x="525" y="132" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">throughput vs</text>
  <text x="525" y="145" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">latency frontier</text>
  
  <!-- Step 5: Generator -->
  <rect x="610" y="70" width="110" height="70" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="665" y="92" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">5. Generator</text>
  <text x="665" y="110" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Produce</text>
  <text x="665" y="124" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Dynamo launch</text>
  <text x="665" y="136" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">configurations</text>
  
  <!-- Flow arrows -->
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#76B900"/>
    </marker>
  </defs>
  
  <line x1="160" y1="105" x2="190" y2="105" stroke="#76B900" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="300" y1="105" x2="330" y2="105" stroke="#76B900" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="440" y1="105" x2="470" y2="105" stroke="#76B900" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="580" y1="105" x2="610" y2="105" stroke="#76B900" stroke-width="2" marker-end="url(#arrow-green)"/>
  
  <!-- Time annotation -->
  <text x="375" y="170" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#76B900" font-weight="bold">~ 30 seconds total (CPU only)</text>
  
  <!-- Three Serving Modes -->
  <text x="375" y="210" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Three Serving Modes Modeled</text>
  
  <rect x="60" y="230" width="180" height="80" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="1.5" rx="4"/>
  <text x="150" y="252" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Static Batching</text>
  <text x="150" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Fixed batch sizes,</text>
  <text x="150" y="285" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">sequential processing,</text>
  <text x="150" y="300" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">simple to reason about</text>
  
  <rect x="270" y="230" width="180" height="80" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="1.5" rx="4"/>
  <text x="360" y="246" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Aggregated</text>
  <text x="360" y="260" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">(Continuous Batching)</text>
  <text x="360" y="278" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Prefill/decode share GPU,</text>
  <text x="360" y="293" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">models interference</text>
  
  <rect x="480" y="230" width="180" height="80" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="1.5" rx="4"/>
  <text x="570" y="246" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Disaggregated</text>
  <text x="570" y="260" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Prefill/Decode</text>
  <text x="570" y="278" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Separate GPU pools,</text>
  <text x="570" y="293" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">models KV transfer</text>
</svg>