<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1e1e1e" font-weight="bold">TRT-LLM arg_map Mutation Pipeline</text>
  
  <!-- User inputs at top -->
  <rect x="80" y="60" width="140" height="50" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="150" y="82" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">User YAML</text>
  <text x="150" y="98" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Base configuration</text>
  
  <rect x="250" y="60" width="140" height="50" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="320" y="76" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">extra_engine_args</text>
  <text x="320" y="91" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Additional args</text>
  <text x="320" y="104" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">merged in</text>
  
  <rect x="420" y="60" width="140" height="50" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="490" y="76" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">override_engine_args</text>
  <text x="490" y="91" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Explicit precedence</text>
  <text x="490" y="104" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">(deep merge)</text>
  
  <!-- Arrows down to mutation pipeline -->
  <defs>
    <marker id="arrow-down" markerWidth="10" markerHeight="10" refX="3" refY="9" orient="auto">
      <polygon points="0 0, 6 0, 3 10" fill="#76B900"/>
    </marker>
    <marker id="arrow-right" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#cc0000"/>
    </marker>
  </defs>
  
  <line x1="150" y1="110" x2="150" y2="145" stroke="#76B900" stroke-width="2" marker-end="url(#arrow-down)"/>
  <line x1="320" y1="110" x2="320" y2="145" stroke="#76B900" stroke-width="2" marker-end="url(#arrow-down)"/>
  <line x1="490" y1="110" x2="490" y2="145" stroke="#76B900" stroke-width="2" marker-end="url(#arrow-down)"/>
  
  <!-- Mutation pipeline box -->
  <rect x="50" y="145" width="520" height="180" fill="#fff5f5" stroke="#cc0000" stroke-width="2" rx="4" stroke-dasharray="4,4"/>
  <text x="310" y="170" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#cc0000" font-weight="bold">Warning: Mutation Pipeline (where user values can be lost)</text>
  
  <!-- Mutation steps -->
  <rect x="70" y="185" width="140" height="60" fill="#ffe8e8" stroke="#cc0000" stroke-width="1.5" rx="3"/>
  <text x="140" y="203" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="bold">1. Merge extra args</text>
  <text x="140" y="218" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">into arg_map</text>
  <text x="140" y="233" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#cc0000" font-style="italic">Can overwrite!</text>
  
  <rect x="230" y="185" width="140" height="60" fill="#ffe8e8" stroke="#cc0000" stroke-width="1.5" rx="3"/>
  <text x="300" y="198" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="bold">2. KvCacheConfig</text>
  <text x="300" y="212" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="bold">conversion</text>
  <text x="300" y="227" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">dict to object</text>
  <text x="300" y="241" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#cc0000" font-style="italic">3 historical bugs here!</text>
  
  <rect x="390" y="185" width="160" height="60" fill="#ffe8e8" stroke="#cc0000" stroke-width="1.5" rx="3"/>
  <text x="470" y="198" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="bold">3. publish_events</text>
  <text x="470" y="212" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="bold">_and_metrics block</text>
  <text x="470" y="227" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Set return_perf_metrics</text>
  <text x="470" y="241" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#cc0000" font-style="italic">Dropped in PR #9284!</text>
  
  <rect x="190" y="265" width="240" height="50" fill="#ffe8e8" stroke="#cc0000" stroke-width="1.5" rx="3"/>
  <text x="310" y="285" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="bold">4. override_engine_args deep merge</text>
  <text x="310" y="302" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Final precedence layer</text>
  
  <!-- Arrow to final output -->
  <line x1="310" y1="325" x2="310" y2="355" stroke="#cc0000" stroke-width="2" marker-end="url(#arrow-down)"/>
  
  <!-- Final LLM call -->
  <rect x="200" y="355" width="220" height="60" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="2" rx="4"/>
  <text x="310" y="378" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">LLM(**arg_map)</text>
  <text x="310" y="396" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">TensorRT-LLM constructor</text>
  <text x="310" y="410" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#cc0000" font-style="italic">Silent overwrite = silent failure</text>
  
  <!-- Fix annotation on the right -->
  <rect x="610" y="180" width="160" height="140" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="690" y="202" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#76B900" font-weight="bold">Fix (PR #9632)</text>
  <text x="690" y="222" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e1e1e">Snapshot user keys</text>
  <text x="690" y="237" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e1e1e">before mutations</text>
  <text x="690" y="260" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e1e1e">Diff against final</text>
  <text x="690" y="275" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e1e1e">arg_map</text>
  <text x="690" y="298" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e1e1e">Log warnings for</text>
  <text x="690" y="313" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e1e1e">any overwrites</text>
  
  <line x1="560" y1="250" x2="610" y2="250" stroke="#76B900" stroke-width="2" marker-end="url(#arrow-right)"/>
</svg>