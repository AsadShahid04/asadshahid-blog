<svg xmlns="http://www.w3.org/2000/svg" width="750" height="450" viewBox="0 0 750 450">
  <!-- Title -->
  <text x="375" y="30" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1e1e1e" font-weight="bold">AI Lifecycle: Stages 0-6</text>
  
  <!-- Stage 0: Targets & Architecture -->
  <rect x="50" y="80" width="140" height="80" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="120" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Stage 0-1</text>
  <text x="120" y="125" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Targets &amp;</text>
  <text x="120" y="141" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Architecture</text>
  
  <!-- Stage 2: Pre-train -->
  <rect x="230" y="80" width="140" height="80" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="300" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Stage 2</text>
  <text x="300" y="125" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Pre-train</text>
  <text x="300" y="145" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Base model</text>
  
  <!-- Stage 3: Post-train -->
  <rect x="410" y="80" width="140" height="80" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="480" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Stage 3</text>
  <text x="480" y="125" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Post-train</text>
  <text x="480" y="145" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Behavior &amp; alignment</text>
  
  <!-- Stage 4: Inference -->
  <rect x="590" y="80" width="140" height="80" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="660" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Stage 4</text>
  <text x="660" y="125" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Inference</text>
  <text x="660" y="145" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Production serving</text>
  
  <!-- Stage 5: Applications -->
  <rect x="140" y="240" width="140" height="80" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="210" y="265" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Stage 5</text>
  <text x="210" y="285" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Applications</text>
  <text x="210" y="305" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">End-to-end product</text>
  
  <!-- Stage 6: Research -->
  <rect x="320" y="240" width="140" height="80" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="390" y="265" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Stage 6</text>
  <text x="390" y="285" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Research</text>
  <text x="390" y="305" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Iteration &amp; evidence</text>
  
  <!-- Flow arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#76B900"/>
    </marker>
  </defs>
  
  <!-- Horizontal flow -->
  <line x1="190" y1="120" x2="230" y2="120" stroke="#76B900" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="120" x2="410" y2="120" stroke="#76B900" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="120" x2="590" y2="120" stroke="#76B900" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Down to Stage 5 -->
  <line x1="660" y1="160" x2="660" y2="200" stroke="#76B900" stroke-width="2"/>
  <line x1="660" y1="200" x2="280" y2="200" stroke="#76B900" stroke-width="2"/>
  <line x1="280" y1="200" x2="210" y2="240" stroke="#76B900" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- To Stage 6 -->
  <line x1="280" y1="280" x2="320" y2="280" stroke="#76B900" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Feedback loop -->
  <path d="M 390 240 Q 390 50 120 50" stroke="#76B900" stroke-width="2" fill="none" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="375" y="40" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#76B900">Feedback Loop</text>
  
  <!-- Artifacts box -->
  <rect x="50" y="360" width="680" height="70" fill="#fff9e6" stroke="#666" stroke-width="1.5" rx="4"/>
  <text x="390" y="380" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Key Artifacts at Each Stage</text>
  <text x="390" y="398" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Stage 0-1: Model definition | Stage 2: Base model + telemetry | Stage 3: Post-trained model</text>
  <text x="390" y="413" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Stage 4: Serving config | Stage 5: End-to-end product | Stage 6: Research evidence</text>
</svg>
