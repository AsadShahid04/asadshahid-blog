<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350">
  <!-- Prefill Node -->
  <g id="prefill-node">
    <rect x="50" y="80" width="280" height="200" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="2" rx="4"/>
    <text x="190" y="110" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Prefill Node</text>
    
    <!-- GPU VRAM -->
    <rect x="70" y="140" width="240" height="50" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="3"/>
    <text x="190" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">GPU VRAM</text>
    <text x="190" y="178" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">KV Cache Buffers</text>
    
    <!-- CPU (not on fast path) -->
    <rect x="70" y="210" width="240" height="50" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="3" stroke-dasharray="4,4"/>
    <text x="190" y="230" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666" font-style="italic">Host DRAM</text>
    <text x="190" y="248" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#999">(not on fast path)</text>
  </g>
  
  <!-- Decode Node -->
  <g id="decode-node">
    <rect x="470" y="80" width="280" height="200" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="2" rx="4"/>
    <text x="610" y="110" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Decode Node</text>
    
    <!-- GPU VRAM -->
    <rect x="490" y="140" width="240" height="50" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="3"/>
    <text x="610" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">GPU VRAM</text>
    <text x="610" y="178" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">KV Cache Buffers</text>
    
    <!-- CPU (not on fast path) -->
    <rect x="490" y="210" width="240" height="50" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="3" stroke-dasharray="4,4"/>
    <text x="610" y="230" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666" font-style="italic">Host DRAM</text>
    <text x="610" y="248" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#999">(not on fast path)</text>
  </g>
  
  <!-- Direct GPU-to-GPU transfer arrow -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#76B900"/>
    </marker>
  </defs>
  
  <line x1="310" y1="165" x2="490" y2="165" stroke="#76B900" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="400" y="150" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#76B900" font-weight="bold">NIXL RDMA WRITE</text>
  <text x="400" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#76B900">(GPU to GPU direct - fast path)</text>
  
  <!-- Slow path (dashed arrow through CPU) -->
  <line x1="190" y1="190" x2="190" y2="230" stroke="#cc0000" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="190" y1="235" x2="610" y2="235" stroke="#cc0000" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="610" y1="235" x2="610" y2="190" stroke="#cc0000" stroke-width="1.5" stroke-dasharray="4,4"/>
  
  <text x="400" y="220" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#cc0000" font-style="italic">Slow path (cuda_copy/host staging):</text>
  <text x="400" y="234" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#cc0000" font-style="italic">GPU to Host to Network to Host to GPU</text>
  
  <!-- Fabric label -->
  <text x="400" y="45" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666">InfiniBand / RoCE / EFA Fabric</text>
</svg>