<svg xmlns="http://www.w3.org/2000/svg" width="750" height="650" viewBox="0 0 750 650">
  <!-- Layer 1: Inference Engines -->
  <text x="20" y="75" font-family="Arial, sans-serif" font-size="13" fill="#76B900" font-weight="bold">Layer 1:</text>
  <text x="20" y="90" font-family="Arial, sans-serif" font-size="13" fill="#76B900">Inference</text>
  <text x="20" y="105" font-family="Arial, sans-serif" font-size="13" fill="#76B900">Engines</text>
  
  <rect x="100" y="60" width="200" height="70" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="2" rx="4"/>
  <text x="200" y="82" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Prefill Worker</text>
  <text x="200" y="100" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">TRT-LLM / vLLM / SGLang</text>
  <text x="200" y="115" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">KV in GPU VRAM</text>
  
  <rect x="330" y="60" width="200" height="70" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="2" rx="4"/>
  <text x="430" y="82" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Decode Worker</text>
  <text x="430" y="100" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">TRT-LLM / vLLM / SGLang</text>
  <text x="430" y="115" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">KV in GPU VRAM</text>
  
  <!-- Layer 2: Optional Dynamo wrapper -->
  <text x="20" y="175" font-family="Arial, sans-serif" font-size="13" fill="#76B900" font-weight="bold">Layer 2:</text>
  <text x="20" y="190" font-family="Arial, sans-serif" font-size="13" fill="#76B900">Optional</text>
  <text x="20" y="205" font-family="Arial, sans-serif" font-size="13" fill="#76B900">Wrapper</text>
  
  <rect x="100" y="160" width="430" height="50" fill="#f0f8e8" stroke="#76B900" stroke-width="2" rx="4" stroke-dasharray="4,4"/>
  <text x="315" y="182" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">dynamo.nixl_connect (optional Dynamo Python wrapper)</text>
  <text x="315" y="198" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666" font-style="italic">Engines can call NIXL directly</text>
  
  <!-- Layer 3: NIXL core -->
  <text x="20" y="250" font-family="Arial, sans-serif" font-size="13" fill="#76B900" font-weight="bold">Layer 3:</text>
  <text x="20" y="265" font-family="Arial, sans-serif" font-size="13" fill="#76B900">NIXL</text>
  <text x="20" y="280" font-family="Arial, sans-serif" font-size="13" fill="#76B900">Core</text>
  
  <rect x="100" y="235" width="430" height="60" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="315" y="257" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">NIXL Library</text>
  <text x="315" y="275" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e">Registered segments • READ / WRITE operations</text>
  
  <!-- Layer 4: NIXL plugins -->
  <text x="20" y="335" font-family="Arial, sans-serif" font-size="13" fill="#76B900" font-weight="bold">Layer 4:</text>
  <text x="20" y="350" font-family="Arial, sans-serif" font-size="13" fill="#76B900">NIXL</text>
  <text x="20" y="365" font-family="Arial, sans-serif" font-size="13" fill="#76B900">Plugins</text>
  
  <rect x="100" y="320" width="430" height="55" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="315" y="342" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">NIXL Plugins</text>
  <text x="315" y="360" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e">UCX • LIBFABRIC • GDS</text>
  
  <!-- Layer 5: UCX transports -->
  <text x="20" y="415" font-family="Arial, sans-serif" font-size="13" fill="#76B900" font-weight="bold">Layer 5:</text>
  <text x="20" y="430" font-family="Arial, sans-serif" font-size="13" fill="#76B900">UCX TLS</text>
  <text x="20" y="445" font-family="Arial, sans-serif" font-size="13" fill="#76B900">Transports</text>
  
  <rect x="100" y="400" width="430" height="70" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="2" rx="4"/>
  <text x="315" y="420" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">UCX Transport Layer Selections (TLS)</text>
  <text x="315" y="440" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">rc_x / dc_x (RDMA over IB/RoCE) - fast path</text>
  <text x="315" y="456" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">cuda_ipc (same node) • cuda_copy (host staging) • tcp (fallback)</text>
  
  <!-- Layer 6: Hardware -->
  <text x="20" y="515" font-family="Arial, sans-serif" font-size="13" fill="#76B900" font-weight="bold">Layer 6:</text>
  <text x="20" y="530" font-family="Arial, sans-serif" font-size="13" fill="#76B900">Hardware</text>
  <text x="20" y="545" font-family="Arial, sans-serif" font-size="13" fill="#76B900">Fabric</text>
  
  <rect x="100" y="495" width="430" height="70" fill="#e8e8e8" stroke="#1e1e1e" stroke-width="2" rx="4"/>
  <text x="315" y="517" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Hardware Interconnects</text>
  <text x="315" y="537" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">NVLink / NVSwitch (same node, multi-GPU)</text>
  <text x="315" y="553" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">InfiniBand / RoCE / EFA (cross-node RDMA)</text>
  
  <!-- Vertical flow indicators with proper arrows -->
  <defs>
    <marker id="arrow-down" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <polygon points="0,0 8,0 4,8" fill="#76B900"/>
    </marker>
  </defs>
  
  <line x1="315" y1="130" x2="315" y2="160" stroke="#76B900" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-down)"/>
  <line x1="315" y1="210" x2="315" y2="235" stroke="#76B900" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-down)"/>
  <line x1="315" y1="295" x2="315" y2="320" stroke="#76B900" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-down)"/>
  <line x1="315" y1="375" x2="315" y2="400" stroke="#76B900" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-down)"/>
  <line x1="315" y1="470" x2="315" y2="495" stroke="#76B900" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-down)"/>
  
  <!-- Bottom note -->
  <text x="315" y="600" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666" font-style="italic">KV cache transfers flow through NIXL layers; fast path avoids host staging</text>
</svg>