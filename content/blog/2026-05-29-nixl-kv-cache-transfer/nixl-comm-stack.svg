<svg xmlns="http://www.w3.org/2000/svg" width="750" height="700" viewBox="0 0 750 700">
  <!-- Layer 1: Inference Engines -->
  <text x="20" y="75" font-family="Arial, sans-serif" font-size="13" fill="#76B900" font-weight="bold">Layer 1:</text>
  <text x="20" y="90" font-family="Arial, sans-serif" font-size="13" fill="#76B900">Inference</text>
  <text x="20" y="105" font-family="Arial, sans-serif" font-size="13" fill="#76B900">Engines</text>
  
  <rect x="100" y="60" width="200" height="70" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="2" rx="4"/>
  <text x="200" y="82" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Prefill Worker</text>
  <text x="200" y="100" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">TRT-LLM / vLLM / SGLang</text>
  <text x="200" y="115" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">KV in GPU VRAM</text>
  
  <rect x="330" y="60" width="200" height="70" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="2" rx="4"/>
  <text x="430" y="82" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Decode Worker</text>
  <text x="430" y="100" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">TRT-LLM / vLLM / SGLang</text>
  <text x="430" y="115" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">KV in GPU VRAM</text>
  
  <!-- Layer 2: Optional Dynamo wrapper -->
  <text x="20" y="175" font-family="Arial, sans-serif" font-size="13" fill="#76B900" font-weight="bold">Layer 2:</text>
  <text x="20" y="190" font-family="Arial, sans-serif" font-size="13" fill="#76B900">Optional</text>
  <text x="20" y="205" font-family="Arial, sans-serif" font-size="13" fill="#76B900">Wrapper</text>
  
  <rect x="100" y="160" width="430" height="50" fill="#f0f8e8" stroke="#76B900" stroke-width="2" rx="4" stroke-dasharray="4,4"/>
  <text x="315" y="182" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">dynamo.nixl_connect (optional Dynamo Python path)</text>
  <text x="315" y="198" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666" font-style="italic">vLLM NixlConnector / TRT-LLM NIXL can skip this layer</text>
  
  <!-- Layer 3: NIXL core -->
  <text x="20" y="250" font-family="Arial, sans-serif" font-size="13" fill="#76B900" font-weight="bold">Layer 3:</text>
  <text x="20" y="265" font-family="Arial, sans-serif" font-size="13" fill="#76B900">NIXL</text>
  <text x="20" y="280" font-family="Arial, sans-serif" font-size="13" fill="#76B900">Core</text>
  
  <rect x="100" y="235" width="430" height="60" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="315" y="257" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">NIXL Library</text>
  <text x="315" y="275" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e">Registered segments • READ / WRITE operations</text>
  
  <!-- Layer 4: NIXL plugins -->
  <text x="20" y="335" font-family="Arial, sans-serif" font-size="13" fill="#76B900" font-weight="bold">Layer 4:</text>
  <text x="20" y="350" font-family="Arial, sans-serif" font-size="13" fill="#76B900">NIXL</text>
  <text x="20" y="365" font-family="Arial, sans-serif" font-size="13" fill="#76B900">Plugins</text>
  
  <!-- Three plugin boxes -->
  <rect x="100" y="320" width="130" height="55" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="165" y="345" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">UCX</text>
  <text x="165" y="362" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Plugin</text>
  
  <rect x="250" y="320" width="130" height="55" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="315" y="345" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">LIBFABRIC</text>
  <text x="315" y="362" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Plugin</text>
  
  <rect x="400" y="320" width="130" height="55" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="465" y="345" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">GDS</text>
  <text x="465" y="362" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Plugin</text>
  
  <!-- Layer 5: Branched transports -->
  <text x="20" y="420" font-family="Arial, sans-serif" font-size="13" fill="#76B900" font-weight="bold">Layer 5:</text>
  <text x="20" y="435" font-family="Arial, sans-serif" font-size="13" fill="#76B900">Plugin</text>
  <text x="20" y="450" font-family="Arial, sans-serif" font-size="13" fill="#76B900">Transports</text>
  
  <!-- UCX TLS box -->
  <rect x="100" y="400" width="130" height="80" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="2" rx="4"/>
  <text x="165" y="420" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="bold">UCX TLS</text>
  <text x="165" y="437" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">rc_x / dc_x (RDMA)</text>
  <text x="165" y="451" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">cuda_ipc</text>
  <text x="165" y="465" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">cuda_copy • tcp</text>
  
  <!-- LIBFABRIC path box -->
  <rect x="250" y="400" width="130" height="80" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="2" rx="4"/>
  <text x="315" y="420" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="bold">libfabric</text>
  <text x="315" y="437" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">EFA</text>
  <text x="315" y="451" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">libfabric fabrics</text>
  
  <!-- GDS path box -->
  <rect x="400" y="400" width="130" height="80" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="2" rx="4"/>
  <text x="465" y="420" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="bold">GPUDirect</text>
  <text x="465" y="437" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Storage</text>
  <text x="465" y="454" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Direct GPU I/O</text>
  
  <!-- Layer 6: Split Hardware per plugin -->
  <text x="20" y="525" font-family="Arial, sans-serif" font-size="13" fill="#76B900" font-weight="bold">Layer 6:</text>
  <text x="20" y="540" font-family="Arial, sans-serif" font-size="13" fill="#76B900">Hardware</text>
  <text x="20" y="555" font-family="Arial, sans-serif" font-size="13" fill="#76B900">Fabric</text>
  
  <!-- UCX hardware box -->
  <rect x="100" y="505" width="130" height="70" fill="#e8e8e8" stroke="#1e1e1e" stroke-width="2" rx="4"/>
  <text x="165" y="527" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e1e1e" font-weight="bold">IB / RoCE</text>
  <text x="165" y="547" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">InfiniBand / RoCE</text>
  <text x="165" y="563" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">NVLink (same node)</text>
  
  <!-- LIBFABRIC hardware box -->
  <rect x="250" y="505" width="130" height="70" fill="#e8e8e8" stroke="#1e1e1e" stroke-width="2" rx="4"/>
  <text x="315" y="527" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e1e1e" font-weight="bold">EFA</text>
  <text x="315" y="547" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">AWS Elastic</text>
  <text x="315" y="563" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Fabric Adapter</text>
  
  <!-- GDS hardware box -->
  <rect x="400" y="505" width="130" height="70" fill="#e8e8e8" stroke="#1e1e1e" stroke-width="2" rx="4"/>
  <text x="465" y="527" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e1e1e" font-weight="bold">NVMe</text>
  <text x="465" y="547" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">GPUDirect Storage</text>
  <text x="465" y="563" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Local storage I/O</text>
  
  <!-- Vertical flow indicators with proper arrows -->
  <defs>
    <marker id="arrow-down" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <polygon points="0,0 8,0 4,8" fill="#76B900"/>
    </marker>
  </defs>
  
  <line x1="315" y1="130" x2="315" y2="160" stroke="#76B900" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-down)"/>
  <line x1="315" y1="210" x2="315" y2="235" stroke="#76B900" stroke-width="2" marker-end="url(#arrow-down)"/>
  <line x1="315" y1="295" x2="315" y2="320" stroke="#76B900" stroke-width="2" marker-end="url(#arrow-down)"/>
  
  <!-- Branched arrows from Layer 4 to Layer 5 -->
  <line x1="165" y1="375" x2="165" y2="400" stroke="#76B900" stroke-width="2" marker-end="url(#arrow-down)"/>
  <line x1="315" y1="375" x2="315" y2="400" stroke="#76B900" stroke-width="2" marker-end="url(#arrow-down)"/>
  <line x1="465" y1="375" x2="465" y2="400" stroke="#76B900" stroke-width="2" marker-end="url(#arrow-down)"/>
  
  <!-- Straight arrows from Layer 5 to Layer 6 (each column) -->
  <line x1="165" y1="480" x2="165" y2="505" stroke="#76B900" stroke-width="2" marker-end="url(#arrow-down)"/>
  <line x1="315" y1="480" x2="315" y2="505" stroke="#76B900" stroke-width="2" marker-end="url(#arrow-down)"/>
  <line x1="465" y1="480" x2="465" y2="505" stroke="#76B900" stroke-width="2" marker-end="url(#arrow-down)"/>
  
  <!-- Bottom note -->
  <text x="315" y="620" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666" font-style="italic">UCX TLS applies only under UCX plugin. LIBFABRIC uses EFA/libfabric fabrics.</text>
  <text x="315" y="638" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666" font-style="italic">GDS is for local storage (NVMe), not network fabric. dynamo.nixl_connect is optional.</text>
</svg>