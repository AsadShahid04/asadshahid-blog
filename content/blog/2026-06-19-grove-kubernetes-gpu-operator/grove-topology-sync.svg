<svg xmlns="http://www.w3.org/2000/svg" width="850" height="450" viewBox="0 0 850 450">
  <!-- Title -->
  <text x="425" y="30" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Grove Startup: Topology Synchronization Problem</text>
  
  <!-- Before fix (left side) -->
  <text x="220" y="70" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#cc0000" font-weight="bold">Before Fix (Thundering Herd)</text>
  
  <rect x="50" y="90" width="340" height="310" fill="#fff5f5" stroke="#cc0000" stroke-width="2" rx="4" stroke-dasharray="4,4"/>
  
  <!-- Replicas -->
  <rect x="70" y="110" width="90" height="50" fill="#ffe8e8" stroke="#cc0000" stroke-width="1.5" rx="3"/>
  <text x="115" y="132" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Replica 1</text>
  <text x="115" y="148" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Starting up...</text>
  
  <rect x="180" y="110" width="90" height="50" fill="#ffe8e8" stroke="#cc0000" stroke-width="1.5" rx="3"/>
  <text x="225" y="132" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Replica 2</text>
  <text x="225" y="148" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Starting up...</text>
  
  <rect x="290" y="110" width="90" height="50" fill="#ffe8e8" stroke="#cc0000" stroke-width="1.5" rx="3"/>
  <text x="335" y="132" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Replica 3</text>
  <text x="335" y="148" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Starting up...</text>
  
  <!-- All call SynchronizeTopology -->
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#cc0000"/>
    </marker>
  </defs>
  
  <line x1="115" y1="160" x2="115" y2="200" stroke="#cc0000" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="225" y1="160" x2="225" y2="200" stroke="#cc0000" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="335" y1="160" x2="335" y2="200" stroke="#cc0000" stroke-width="2" marker-end="url(#arrow-red)"/>
  
  <text x="220" y="185" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#cc0000" font-weight="bold">All call SynchronizeTopology()</text>
  <text x="220" y="198" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#cc0000">BEFORE mgr.Start() / leader election</text>
  
  <!-- API Server (overloaded) -->
  <rect x="100" y="210" width="240" height="60" fill="#ffe8e8" stroke="#cc0000" stroke-width="2" rx="3"/>
  <text x="220" y="232" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">K8s API Server</text>
  <text x="220" y="250" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#cc0000">Warning: 3x uncached sync calls</text>
  <text x="220" y="264" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#cc0000">C x B x k API calls each</text>
  
  <!-- Errors -->
  <text x="220" y="295" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#cc0000" font-weight="bold">503 Service Unavailable</text>
  <text x="220" y="310" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Timeout / Connection Refused</text>
  
  <!-- Crash and retry -->
  <text x="220" y="335" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#cc0000" font-weight="bold">handleErrorAndExit()</text>
  <text x="220" y="350" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Operator crashes</text>
  
  <text x="220" y="375" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#cc0000" font-weight="bold">Kubelet restarts all 3</text>
  <text x="220" y="390" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Immediate retry (no backoff)</text>
  
  <!-- After fix (right side) -->
  <text x="640" y="70" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#76B900" font-weight="bold">After Fix (Bounded Backoff)</text>
  
  <rect x="470" y="90" width="340" height="310" fill="#f0f8e8" stroke="#76B900" stroke-width="2" rx="4"/>
  
  <!-- Replicas with retry -->
  <rect x="490" y="110" width="90" height="50" fill="#e8f5d8" stroke="#76B900" stroke-width="1.5" rx="3"/>
  <text x="535" y="132" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Replica 1</text>
  <text x="535" y="148" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Starting up...</text>
  
  <rect x="600" y="110" width="90" height="50" fill="#e8f5d8" stroke="#76B900" stroke-width="1.5" rx="3"/>
  <text x="645" y="132" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Replica 2</text>
  <text x="645" y="148" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Starting up...</text>
  
  <rect x="710" y="110" width="90" height="50" fill="#e8f5d8" stroke="#76B900" stroke-width="1.5" rx="3"/>
  <text x="755" y="132" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Replica 3</text>
  <text x="755" y="148" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Starting up...</text>
  
  <!-- Retry with backoff -->
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#76B900"/>
    </marker>
  </defs>
  
  <line x1="535" y1="160" x2="535" y2="200" stroke="#76B900" stroke-width="2" stroke-dasharray="2,2" marker-end="url(#arrow-green)"/>
  <line x1="645" y1="160" x2="645" y2="200" stroke="#76B900" stroke-width="2" stroke-dasharray="2,2" marker-end="url(#arrow-green)"/>
  <line x1="755" y1="160" x2="755" y2="200" stroke="#76B900" stroke-width="2" stroke-dasharray="2,2" marker-end="url(#arrow-green)"/>
  
  <text x="640" y="178" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#76B900" font-weight="bold">SynchronizeTopologyWithRetry()</text>
  <text x="640" y="192" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#76B900">Bounded exponential backoff</text>
  
  <!-- API Server (healthy) -->
  <rect x="520" y="210" width="240" height="60" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="3"/>
  <text x="640" y="232" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">K8s API Server</text>
  <text x="640" y="250" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#76B900">Transient errors retried</text>
  <text x="640" y="264" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#76B900">10% jitter spreads load</text>
  
  <!-- Error classification -->
  <text x="640" y="295" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#76B900" font-weight="bold">Error Classification:</text>
  <text x="640" y="310" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Retry: 503, timeout, io.EOF,</text>
  <text x="640" y="323" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">ECONNREFUSED, rate-limit</text>
  
  <text x="640" y="348" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Fail fast: Forbidden,</text>
  <text x="640" y="361" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Unauthorized, missing CRD</text>
  
  <!-- Budget -->
  <text x="640" y="385" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#76B900" font-weight="bold">Total retry budget: ~63s</text>
  <text x="640" y="400" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">(1s + 2s + 4s + 8s + 16s + 32s)</text>
</svg>