<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400">
  <!-- Title -->
  <text x="350" y="30" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Grove PodCliqueSet Architecture</text>
  
  <!-- PodCliqueSet container -->
  <rect x="50" y="60" width="600" height="300" fill="#f5f5f5" stroke="#76B900" stroke-width="3" rx="6"/>
  <text x="350" y="90" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#76B900" font-weight="bold">PodCliqueSet (Inference Stack)</text>
  
  <!-- Prefill PodClique -->
  <rect x="80" y="110" width="160" height="110" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="160" y="132" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Prefill PodClique</text>
  <text x="160" y="152" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Pods: prefill-0, prefill-1, ...</text>
  <text x="160" y="167" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Topology: NVLink island</text>
  <text x="160" y="182" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Role: Process prompts</text>
  <text x="160" y="197" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Generate KV cache</text>
  
  <!-- Decode PodClique -->
  <rect x="270" y="110" width="160" height="110" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="350" y="132" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Decode PodClique</text>
  <text x="350" y="152" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Pods: decode-0, decode-1, ...</text>
  <text x="350" y="167" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Topology: NVLink island</text>
  <text x="350" y="182" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Role: Token generation</text>
  <text x="350" y="197" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">from received KV cache</text>
  
  <!-- Router PodClique -->
  <rect x="460" y="110" width="160" height="110" fill="#e8f5d8" stroke="#76B900" stroke-width="2" rx="4"/>
  <text x="540" y="132" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Router PodClique</text>
  <text x="540" y="152" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Pods: router-0</text>
  <text x="540" y="167" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Topology: Any node</text>
  <text x="540" y="182" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Role: Request routing</text>
  <text x="540" y="197" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Load balancing</text>
  
  <!-- Optional ScalingGroup -->
  <rect x="80" y="240" width="540" height="100" fill="#fff8e8" stroke="#f59e0b" stroke-width="2" rx="4" stroke-dasharray="4,4"/>
  <text x="350" y="262" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#f59e0b" font-weight="bold">Optional: PodCliqueScalingGroup</text>
  <text x="350" y="282" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Gang scheduling: All PodCliques scheduled together or none</text>
  <text x="350" y="297" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Ensures complete inference stack lands on cluster</text>
  <text x="350" y="312" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">No partial deployments due to resource constraints</text>
  <text x="350" y="327" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">All-or-nothing atomic placement</text>
  
  <!-- Bottom note -->
  <text x="350" y="380" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666" font-style="italic">Grove manages placement, ordering, and scaling for the entire stack</text>
</svg>